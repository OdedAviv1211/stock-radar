name: Morning Telegram alert

on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 07:00 שעון קיץ / 06:00 שעון חורף בישראל
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: python notify.py
      - name: Save chat id
        run: |
          if [ -f telegram_chat_id.txt ] && [ -n "$(git status --porcelain telegram_chat_id.txt)" ]; then
            git config user.name "stock-radar-bot"
            git config user.email "actions@users.noreply.github.com"
            git add telegram_chat_id.txt
            git commit -m "Save Telegram chat id"
            git pull --rebase && git push
          fi
